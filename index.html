<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สายใยตระกูล — พงศาวดารพลังยุทธ์ข้ามรุ่น</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- หน้าจอเลือกเพศตอนเริ่มเกม (เนื้อหาสร้างจาก ui.js) -->
  <div id="startScreen" class="start-screen"></div>

  <!-- กล่องตัดสินใจ โผล่เมื่อสุ่มสถานการณ์ที่ต้องเลือก (เนื้อหาสร้างจาก ui.js) -->
  <div id="decision" class="decision-overlay"></div>

  <!-- แผ่นข้อมูลตัวละคร โผล่เมื่อกดการ์ดในผัง (เนื้อหาสร้างจาก ui.js) -->
  <div id="detail" class="detail-overlay"></div>

  <header>
    <div class="brand">
      <span class="brand-title display">สายใยตระกูล</span>
      <span class="brand-date" id="dateLabel">—</span>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="stat-label">คลังเครดิต</span>
        <span class="stat-value" id="goldLabel">0</span>
        <span class="income pos" id="incomeLabel">+0.0</span>
      </div>
      <div class="stat">
        <span class="stat-label">พลังยุทธ์รวม</span>
        <span class="stat-value" id="powerLabel">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">ชื่อเสียง</span>
        <span class="stat-value" id="repLabel">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">สมาชิก</span>
        <span class="stat-value" id="membersLabel">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">รุ่นที่</span>
        <span class="stat-value" id="gensLabel">1</span>
      </div>
    </div>

    <div class="clock-controls">
      <button id="playBtn" class="clock-btn" aria-label="เดินเวลา">▶</button>
      <button id="speedBtn" class="clock-btn speed" aria-label="เปลี่ยนความเร็ว">×1</button>
      <button id="autoBtn" class="clock-btn auto" aria-label="สลับโหมดตัดสินใจ">ถามทุกครั้ง</button>
    </div>
  </header>

  <main>
    <section id="treePanel">
      <div id="winBanner" class="banner">
        ตระกูลรุ่งเรืองเป็นที่เลื่องลือทั่วนคร — ท่านบรรลุเป้าหมายแล้ว แต่ยังเล่นต่อได้ตามใจ
      </div>

      <!-- กรอบซูม/เลื่อน: treeCanvas คือชั้นที่ถูก transform, tree คือเนื้อผัง -->
      <div id="treeViewport">
        <div id="treeCanvas"><div id="tree"></div></div>
      </div>

      <div class="zoom-controls">
        <button id="zoomOut" class="zoom-btn" aria-label="ซูมออก">−</button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button id="zoomIn" class="zoom-btn" aria-label="ซูมเข้า">+</button>
        <button id="zoomFit" class="zoom-btn wide" aria-label="จัดให้พอดีจอ">พอดีจอ</button>
      </div>
    </section>

    <!-- collapsed มีผลเฉพาะจอแคบ บนเดสก์ท็อปคลาสนี้ถูกมองข้าม -->
    <aside id="chroniclePanel" class="collapsed">
      <!-- บนมือถือหัวข้อนี้กลายเป็นแถบกดพับ/กางลิ้นชัก เพื่อคืนพื้นที่ให้ผัง -->
      <button id="logToggle" class="log-toggle" aria-expanded="false">
        <span class="display">จดหมายเหตุ</span>
        <span class="log-caret" aria-hidden="true">▲</span>
      </button>
      <div id="log"><p class="empty-note">เหตุการณ์จะถูกบันทึกที่นี่เมื่อเวลาเริ่มเดิน</p></div>
    </aside>
  </main>

  <!-- ลำดับโหลดสำคัญ: ข้อมูล -> เอนจิน -> ตัวละคร -> ผัง -> นาฬิกา -> สถานะ -> UI -> ตัวประสาน -->
  <script src="js/data.js"></script>
  <!-- คลังคุณลักษณะติดตัว (trait) ที่ผู้ใช้แก้เองได้ — engine ต้องมาก่อน traits-* -->
  <script src="js/trait/engine.js"></script>
  <script src="js/trait/traits-common.js"></script>
  <script src="js/trait/traits-bond.js"></script>
  <script src="js/trait/traits-female.js"></script>
  <script src="js/trait/traits-male.js"></script>
  <!-- คลังอีเวนต์ที่ผู้ใช้แก้เองได้ ทุกไฟล์ลงทะเบียนเข้า EventTemplates เดียวกัน -->
  <script src="js/events/appearance.js"></script>
  <script src="js/events/secret-inlaw-female.js"></script>
  <script src="js/events/secret-inlaw-male.js"></script>
  <script src="js/events/flirt-female.js"></script>
  <script src="js/events/flirt-male.js"></script>
  <script src="js/events/trait-female.js"></script>
  <script src="js/events/trait-male.js"></script>
  <script src="js/events/drama.js"></script>
  <script src="js/scenario-engine.js"></script>
  <script src="js/person.js"></script>
  <script src="js/lineage.js"></script>
  <script src="js/relations.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/state.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tree-layout.js"></script>
  <script src="js/tree-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
