<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สายใยตระกูล — พงศาวดารพลังยุทธ์ข้ามรุ่น</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- หน้าจอเลือกเพศตอนเริ่มเกม (เนื้อหาสร้างจาก ui.js) -->
  <div id="startScreen" class="start-screen"></div>

  <!-- กล่องตัดสินใจ โผล่เมื่อสุ่มสถานการณ์ที่ต้องเลือก (เนื้อหาสร้างจาก ui.js) -->
  <div id="decision" class="decision-overlay"></div>

  <header>
    <div class="brand">
      <span class="brand-title display">สายใยตระกูล</span>
      <span class="brand-date" id="dateLabel">—</span>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="stat-label">คลังเครดิต</span>
        <span class="stat-value" id="goldLabel">0</span>
        <span class="income pos" id="incomeLabel">+0.0</span>
      </div>
      <div class="stat">
        <span class="stat-label">พลังยุทธ์รวม</span>
        <span class="stat-value" id="powerLabel">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">ชื่อเสียง</span>
        <span class="stat-value" id="repLabel">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">สมาชิก</span>
        <span class="stat-value" id="membersLabel">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">รุ่นที่</span>
        <span class="stat-value" id="gensLabel">1</span>
      </div>
    </div>

    <div class="clock-controls">
      <button id="playBtn" class="clock-btn" aria-label="เดินเวลา">▶</button>
      <button id="speedBtn" class="clock-btn speed" aria-label="เปลี่ยนความเร็ว">×1</button>
    </div>
  </header>

  <main>
    <section id="treePanel">
      <div id="winBanner" class="banner">
        ตระกูลรุ่งเรืองเป็นที่เลื่องลือทั่วแผ่นดิน — ท่านบรรลุเป้าหมายแล้ว แต่ยังเล่นต่อได้ตามใจ
      </div>
      <div id="tree"></div>
    </section>

    <aside id="chroniclePanel">
      <h2 class="display">จดหมายเหตุ</h2>
      <div id="log"><p class="empty-note">เหตุการณ์จะถูกบันทึกที่นี่เมื่อเวลาเริ่มเดิน</p></div>
    </aside>
  </main>

  <!-- ลำดับโหลดสำคัญ: ข้อมูล -> เอนจิน -> ตัวละคร -> ผัง -> นาฬิกา -> สถานะ -> UI -> ตัวประสาน -->
  <script src="js/data.js"></script>
  <script src="js/scenario-engine.js"></script>
  <script src="js/person.js"></script>
  <script src="js/lineage.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tree-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
